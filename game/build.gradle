plugins {
    id 'java-library'
    id 'io.github.0ffz.github-packages' version '1.2.1'
}

dependencies {
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'org.jmonkeyengine:jme3-terrain:3.10.0-beta3'

    implementation libs.jmeDesktop
    api libs.jmeCore

    runtimeOnly libs.jmeJogg
    runtimeOnly libs.jmePlugins
}
